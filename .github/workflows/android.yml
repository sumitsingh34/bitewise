# Builds the Android app (the F-Droid version) on every push and pull request,
# so a broken build shows up before F-Droid tries it.
name: Android build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs, run lint
        run: ./gradlew assembleDebug assembleRelease lintRelease
      - name: Keep the debug APK for testing on a phone
        uses: actions/upload-artifact@v4
        with:
          name: bitewise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
