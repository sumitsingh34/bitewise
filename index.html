/* ---------- history ---------- */
const RANGES = [["7D",7],["1M",30],["3M",91],["6M",182],["1Y",365],["2Y",730],["3Y",1095],["All",0]];
let calRange = "7D", calView = "bar", wRange = "7D";
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
function rangeStart(key, earliest){
  const n = RANGES.find(r => r[0] === key)[1];
  if (n) return addDays(today0(), -(n - 1));
  return earliest ? fromKey(earliest) : addDays(today0(), -6);
}
const rangeButtons = (which, sel) => `<div class="ranges" role="group" aria-label="Time range">${RANGES.map(([k]) =>
  `<button data-${which}="${k}" aria-pressed="${k === sel}">${k}</button>`).join("")}</div>`;
function tickLabel(d, spanDays){
  if (spanDays <= 7) return d.toLocaleDateString(undefined, { weekday:"narrow" });
  if (spanDays <= 92) return d.toLocaleDateString(undefined, { day:"numeric", month:"short" });
  return d.toLocaleDateString(undefined, { month:"short", year:"2-digit" });
}

function calCard(){
  const goal = S.settings.goal;
  const logged = Object.keys(S.days).filter(hasFood).sort();
  const start = rangeStart(calRange, logged[0]), end = today0();
  const spanDays = Math.round((end - start) / 864e5) + 1;
  // one point per day, or per week for long ranges
  const step = spanDays > 92 ? 7 : 1, pts = [];
  for (let i = 0; i < spanDays; i += step){
    const ks = []; for (let j = 0; j < step && i + j < spanDays; j++) ks.push(keyOf(addDays(start, i + j)));
    const tt = ks.map(totals).filter(t => t.kcal > 0);
    pts.push({ d:addDays(start, i), v: tt.length ? tt.reduce((a,t) => a + t.kcal, 0) / tt.length : null });
  }
  const inRange = [];
  for (let i = 0; i < spanDays; i++){ const t = totals(keyOf(addDays(start, i))); if (t.kcal > 0) inRange.push(t); }
  const avg = key => inRange.length ? inRange.reduce((a,t) => a + t[key], 0) / inRange.length : 0;

  const W = 320, H = 160, top = 14, bottom = 22, left = 4, right = 4;
  const vals = pts.map(p => p.v).filter(v => v != null);
  const max = Math.max(goal * 1.15, ...vals, 1);
  const y = v => top + (H - top - bottom) * (1 - v / max);
  const n = pts.length, slot = (W - left - right) / n;
  const cx = i => left + slot * (i + 0.5);
  let body = "";
  if (calView === "bar"){
    const bw = Math.max(1.5, slot * (n <= 14 ? 0.62 : 0.72));
    pts.forEach((p, i) => { if (p.v == null) return;
      body += `<rect x="${cx(i) - bw/2}" y="${y(p.v)}" width="${bw}" height="${H - bottom - y(p.v)}" rx="${Math.min(4, bw/3)}" class="wbar ${p.v > goal ? "over" : ""}"><title>${r0(p.v)} kcal</title></rect>`;
      if (n <= 7) body += `<text x="${cx(i)}" y="${y(p.v) - 3}" text-anchor="middle" class="wval">${r0(p.v)}</text>`;
    });
  } else {
    let seg = [];
    const flush = () => { if (seg.length > 1) body += `<polyline points="${seg.join(" ")}" class="wline"/>`; seg = []; };
    pts.forEach((p, i) => { if (p.v == null) { flush(); return; } seg.push(`${cx(i).toFixed(1)},${y(p.v).toFixed(1)}`); });
    flush();
    if (n <= 31) pts.forEach((p, i) => { if (p.v != null) body += `<circle cx="${cx(i)}" cy="${y(p.v)}" r="3" class="wdot ${p.v > goal ? "over" : ""}"><title>${r0(p.v)} kcal</title></circle>`; });
    if (n <= 7) pts.forEach((p, i) => { if (p.v != null) body += `<text x="${cx(i)}" y="${y(p.v) - 7}" text-anchor="middle" class="wval">${r0(p.v)}</text>`; });
  }
  // x labels: all 7 for a week, otherwise ~5 spread out
  const ticks = n <= 7 ? pts.map((_, i) => i) : [0, 1, 2, 3, 4].map(t => Math.round(t * (n - 1) / 4));
  const labels = ticks.map((i, j) => `<text x="${cx(i)}" y="${H - 6}" text-anchor="${n <= 7 ? "middle" : j === 0 ? "start" : j === ticks.length - 1 ? "end" : "middle"}" class="wlbl">${tickLabel(pts[i].d, spanDays)}</text>`).join("");
  return `<section class="card">
    <div class="whead"><h2>Calories</h2>
      <div class="viewtog" role="group" aria-label="Chart type"><button data-cview="bar" aria-pressed="${calView === "bar"}">Bars</button><button data-cview="line" aria-pressed="${calView === "line"}">Line</button></div></div>
    ${rangeButtons("crange", calRange)}
    <svg viewBox="0 0 ${W} ${H}" class="wchart" role="img" aria-label="Calories eaten, ${calRange}">
      <line x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" class="wgoal"/>${body}${labels}</svg>
    <p class="note" style="margin-top:0">Dashed line: your ${r0(goal)} kcal goal${step > 1 ? ". Each point is a weekly average" : ""}.</p>
    ${inRange.length ? `<p class="note" style="margin-top:2px">Daily average over ${inRange.length} logged day${inRange.length === 1 ? "" : "s"}:</p>
    <div class="avgs">
      <div><b>${r0(avg("kcal"))}</b><span>kcal</span></div>
      <div class="m-p"><b>${r0(avg("p"))} g</b><span>Protein</span></div>
      <div class="m-c"><b>${r0(avg("c"))} g</b><span>Carbs</span></div>
      <div class="m-f"><b>${r0(avg("f"))} g</b><span>Fat</span></div>
    </div>` : `<p class="empty">No food logged in this period.</p>`}
  </section>`;
}

function weightCard(){
  const list = [...S.weights].sort((a,b) => a.d.localeCompare(b.d));
  const last = list[list.length - 1];
  const start = rangeStart(wRange, list[0]?.d), end = today0();
  const sk = keyOf(start), pts = list.filter(w => w.d >= sk).map(w => ({ ...w, v:toU(w.kg) }));
  const spanDays = Math.round((end - start) / 864e5) + 1;
  let chart = "";
  if (pts.length){
    const W = 320, H = 150, top = 12, bottom = 22, lpad = 34, rpad = 8;
    const ws = pts.map(p => p.v), lo = Math.min(...ws), hi = Math.max(...ws);
    const mid = (hi + lo) / 2, half = Math.max(wU() === "lb" ? 1.3 : 0.6, (hi - lo) / 2) * 1.25;   // keep the line centred
    const t0 = start.getTime(), ts = Math.max(1, end.getTime() - t0);
    const X = d => lpad + (W - lpad - rpad) * (fromKey(d).getTime() - t0) / ts;
    const Y = kg => top + (H - top - bottom) * (1 - (kg - (mid - half)) / (2 * half));
    const line = pts.map(p => `${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    const ticks = spanDays <= 7 ? [...Array(7)].map((_, i) => addDays(start, i)) : [0,1,2,3,4].map(t => addDays(start, Math.round(t * (spanDays - 1) / 4)));
    chart = `<svg viewBox="0 0 ${W} ${H}" class="wchart" role="img" aria-label="Weight trend, ${wRange}">
      <text x="0" y="${Y(hi)+4}" class="wlbl">${r1(hi)}</text>${hi !== lo ? `<text x="0" y="${Y(lo)+4}" class="wlbl">${r1(lo)}</text>` : ""}
      <line x1="${lpad}" x2="${W}" y1="${Y(hi)}" y2="${Y(hi)}" class="wgrid"/><line x1="${lpad}" x2="${W}" y1="${Y(lo)}" y2="${Y(lo)}" class="wgrid"/>
      ${pts.length > 1 ? `<polyline points="${line}" class="wline"/>` : ""}
      ${pts.length <= 60 ? pts.map(p => `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="3.2" class="wdot"><title>${r1(p.v)} ${wU()}</title></circle>`).join("") : ""}
      ${ticks.map((d, j) => `<text x="${X(keyOf(d))}" y="${H - 6}" text-anchor="${spanDays <= 7 ? "middle" : j === 0 ? "start" : j === ticks.length - 1 ? "end" : "middle"}" class="wlbl">${tickLabel(d, spanDays)}</text>`).join("")}
    </svg>`;
    if (pts.length > 1){
      const diff = pts[pts.length-1].v - pts[0].v;
      chart += `<p class="note" style="margin-top:0">${Math.abs(diff) < 0.05 ? "No change" : (diff > 0 ? "+" : "−") + r1(Math.abs(diff)) + " " + wU()} in this period (${pts.length} weigh-ins)</p>`;
    } else chart += `<p class="note" style="margin-top:0">Only one weigh-in in this period. Try a longer range, or keep logging to see a trend.</p>`;
  } else {
    chart = `<p class="empty">${list.length ? "No weigh-ins in this period. Try a longer range." : "Save your first weigh-in above to start your trend."}</p>`;
  }
  const recent = [...list].reverse().slice(0, 5);
  return `<section class="card">
    <div class="whead"><h2>Weight</h2><span>${last ? `<b>${fmtW(last.kg)}</b>` : ""}</span></div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <label class="f" style="flex:1;margin-top:6px">Today's weight (${wU()})<input id="wIn" type="number" inputmode="decimal" step="0.1" min="1" value="${r1(toU(last ? last.kg : S.settings.weight))}"></label>
      <button class="secondary" id="wSave" style="height:46px">Save</button>
    </div>
    ${rangeButtons("wrange", wRange)}
    ${chart}
    ${recent.length ? `<p class="subhead" style="margin-top:12px">Recent weigh-ins</p><ul class="items">${recent.map(w => `<li><div class="it-main"><div class="it-name">${fmtW(w.kg)}</div>
      <div class="it-sub">${esc(niceDate(w.d))}</div></div><button class="del" data-wdel="${w.d}" aria-label="Remove weigh-in">✕</button></li>`).join("")}</ul>` : ""}
    <p class="note">Weigh yourself at the same time of day, like in the morning, for the most reliable trend.</p>
  </section>`;
}

function renderHistory(){
  const goal = S.settings.goal;
  let html = `<h2 class="page">History</h2>` + calCard() + weightCard() + `<h2 class="subpage">Past days</h2><ul class="items hist">`;
  let any = false;
  for (let i = 0; i < 30; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = keyOf(d), t = totals(k);
    if (i > 0 && !t.kcal && !t.burned) continue;
    any = any || !!(t.kcal || t.burned);
    const net = t.kcal - t.burned, pct = goal ? Math.min(100, net/goal*100) : 0;
    const w = S.days[k]?.water;
    html += `<li data-day="${k}"><div class="it-main"><div class="it-name">${esc(niceDate(k))}</div>
      <div class="it-sub">Food ${r0(t.kcal)} · Exercise ${r0(t.burned)} · P ${r0(t.p)} C ${r0(t.c)} F ${r0(t.f)}${w ? ` · Water ${w}` : ""}</div>
      <div class="hbar"><i class="${net > goal ? "over" : ""}" style="width:${Math.max(0,pct)}%"></i></div></div>
      <span class="it-kcal">${r0(net)}</span></li>`;
  }
  html += `</ul>`;
  if (!any) html += `<p class="empty">Days you log will show up here.</p>`;
  else html += `<p class="note">Right-hand number is net calories (food minus exercise). Tap a day to open it.</p>`;
  $("#app").innerHTML = html;
  document.querySelectorAll("[data-day]").forEach(li => li.onclick = () => { cur = li.dataset.day; tab = "today"; detail = null; backStack = []; render(); window.scrollTo(0,0); });
  const keepScroll = fn => () => { const y = window.scrollY; fn(); render(); window.scrollTo(0, y); };
  document.querySelectorAll("[data-crange]").forEach(b => b.onclick = keepScroll(() => calRange = b.dataset.crange));
  document.querySelectorAll("[data-wrange]").forEach(b => b.onclick = keepScroll(() => wRange = b.dataset.wrange));
  document.querySelectorAll("[data-cview]").forEach(b => b.onclick = keepScroll(() => calView = b.dataset.cview));
  $("#wSave").onclick = () => {
    const v = parseFloat($("#wIn").value);
    if (!(v > 0)){ toast("Enter your weight"); return; }
    const kg = Math.round(fromU(v) * 100) / 100;
    const k = todayKey();
    S.weights = S.weights.filter(w => w.d !== k); S.weights.push({ d:k, kg });
    S.settings.weight = kg;   // keeps exercise estimates up to date
    save(); render(); toast("Weight saved");
  };
  document.querySelectorAll("[data-wdel]").forEach(b => b.onclick = async () => {
    const w = S.weights.find(x => x.d === b.dataset.wdel); if (!w) return;
    if (!await askConfirm(`Remove ${fmtW(w.kg)}?`, niceDate(w.d))) return;
    S.weights = S.weights.filter(x => x.d !== w.d); save(); render(); toast("Removed");
  });
}

/* ---------- settings ---------- */
function renderSettings(){
  $("#app").innerHTML = `
    <h2 class="page">Settings</h2>
    <div class="grid2">
      <label class="f">Daily calorie goal<input id="sGoal" type="number" inputmode="numeric" min="0" value="${r0(S.settings.goal)}"></label>
      <label class="f">Body weight (<span id="wUnitLbl">${wU()}</span>)<input id="sWeight" type="number" inputmode="decimal" min="1" step="0.1" value="${r1(toU(S.settings.weight))}"></label>
    </div>
    <div class="unitrow"><span>Weight unit</span>
      <div class="viewtog" role="group" aria-label="Weight unit">
        <button data-unit="kg" aria-pressed="${wU() === "kg"}">kg</button><button data-unit="lb" aria-pressed="${wU() === "lb"}">lb</button>
      </div></div>
    <p class="note">Weight is used to estimate calories burned during exercise. Saving a weigh-in in History updates it too.</p>
    <label class="check"><input type="checkbox" id="sAddEx" ${S.settings.addExercise ? "checked" : ""}> Add exercise calories to my daily goal</label>
    <p class="note">When on, exercise raises your calories and your protein, carbs and fat targets for that day. Exercise numbers are estimates and are often a bit high, so if your weight isn't moving the way you expect, try turning this off.</p>
    <label class="f">Water goal (glasses of 250 ml)<input id="sWater" type="number" inputmode="numeric" min="1" max="30" value="${S.settings.waterGoal}"></label>

    <p class="subhead" style="margin-top:22px">Calories from protein, carbs and fat</p>
    <div class="grid3">
      <label class="f m-p-lbl">Protein %<input id="mpP" type="number" inputmode="numeric" min="0" max="100" value="${S.settings.macros.p}"></label>
      <label class="f m-c-lbl">Carbs %<input id="mpC" type="number" inputmode="numeric" min="0" max="100" value="${S.settings.macros.c}"></label>
      <label class="f m-f-lbl">Fat %<input id="mpF" type="number" inputmode="numeric" min="0" max="100" value="${S.settings.macros.f}"></label>
    </div>
    <p class="status" id="mpSum"></p>
    <button class="addline" id="mpReset" style="padding-top:2px">Use common split (20 / 50 / 30)</button>
    <p class="note" id="mpGrams"></p>
    <label class="f" style="margin-top:18px">Food search key (optional)<input id="sKey" autocomplete="off" spellcheck="false" value="${esc(S.settings.usdaKey || "")}" placeholder="Leave blank to use the shared key"></label>
    <p class="note">Search works without a key, but the shared key only allows a few searches per hour. For more, get a free key at fdc.nal.usda.gov (API Key sign-up) and paste it here.</p>
    <button class="primary" id="sSave">Save settings</button>

    <h2 class="page" style="margin-top:34px">Your data</h2>
    <p class="note">Everything is stored only on this phone, in this browser. Export a backup now and then so you don't lose it if browser data gets cleared.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="secondary" id="exp">Export backup</button>
      <button class="secondary" id="imp">Import backup</button>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
      <button class="secondary danger" id="wipe">Delete all data</button>
    </div>
    <p class="note" style="margin-top:28px">Barcode data from Open Food Facts (openfoodfacts.org). Food search data from USDA FoodData Central (fdc.nal.usda.gov).</p>
    <p class="note">BiteWise version 24</p>`;
  const mp = () => ({ p:parseFloat($("#mpP").value)||0, c:parseFloat($("#mpC").value)||0, f:parseFloat($("#mpF").value)||0 });
  const showMacros = () => {
    const m = mp(), total = m.p + m.c + m.f, g = parseFloat($("#sGoal").value) || 0;
    const el = $("#mpSum");
    el.textContent = total === 100 ? "Total 100% ✓" : `Total ${r0(total)}%. It needs to add up to 100%.`;
    el.className = total === 100 ? "status" : "status err";
    $("#mpGrams").textContent = total === 100 && g
      ? `Daily targets: protein ${r0(g*m.p/100/4)} g · carbs ${r0(g*m.c/100/4)} g · fat ${r0(g*m.f/100/9)} g`
      : "";
  };
  ["#mpP","#mpC","#mpF","#sGoal"].forEach(id => $(id).addEventListener("input", showMacros));
  showMacros();
  document.querySelectorAll("[data-unit]").forEach(b => b.onclick = () => {
    if (b.dataset.unit === wU()) return;
    const typedKg = fromU(parseFloat($("#sWeight").value) || 0);   // keep what's typed, in the new unit
    S.settings.wUnit = b.dataset.unit; save();
    document.querySelectorAll("[data-unit]").forEach(x => x.setAttribute("aria-pressed", x.dataset.unit === wU()));
    $("#wUnitLbl").textContent = wU();
    if (typedKg) $("#sWeight").value = r1(toU(typedKg));
    toast(`Weight now shown in ${wU()}`);
  });
  $("#mpReset").onclick = () => { $("#mpP").value = COMMON_MACROS.p; $("#mpC").value = COMMON_MACROS.c; $("#mpF").value = COMMON_MACROS.f; showMacros(); toast("Tap Save settings to keep it"); };
  $("#sSave").onclick = () => {
    const g = parseFloat($("#sGoal").value), w = fromU(parseFloat($("#sWeight").value));
    if (!(g > 0) || !(w > 0)){ toast("Enter a goal and weight above zero"); return; }
    const m = mp();
    if (m.p + m.c + m.f !== 100){ toast("Protein, carbs and fat must add up to 100%"); return; }
    S.settings.macros = m; S.settings.macrosSet = true;
    S.settings.addExercise = $("#sAddEx").checked;
    S.settings.waterGoal = Math.max(1, Math.round(parseFloat($("#sWater").value) || 8));
    S.settings.goal = g; S.settings.weight = w; S.settings.usdaKey = $("#sKey").value.trim(); save(); toast("Settings saved");
  };
  $("#exp").onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `bitewise-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("#imp").onclick = () => $("#impFile").click();
  $("#impFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || typeof data.days !== "object") throw 0;
      if (!await askConfirm("Replace your data with this backup?", "Everything currently on this phone will be replaced.", "Replace")) { e.target.value = ""; return; }
      S = { settings: data.settings || blank().settings, days: data.days, foods: data.foods || [], weights: data.weights || [] };
      S.settings.waterGoal ??= 8;
      save(); toast("Backup imported"); render();
    } catch { toast("That file isn't a BiteWise backup"); }
  };
  $("#wipe").onclick = async () => {
    if (!await askConfirm("Delete all data?", "All your logs, saved foods and settings will be deleted. This can't be undone.", "Delete all")) return;
    S = blank(); save(); cur = todayKey(); toast("All data deleted"); render();
  };
}

/* ---------- boot ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; detail = null; backStack = []; if (tab === "today") cur = cur || todayKey(); render(); window.scrollTo(0,0); });
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
