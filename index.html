<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9DB04A">
<title>BiteWise</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 36 36' fill='%231F2410' stroke='%231F2410' stroke-width='0'><rect x='-2' y='-2' width='36' height='36' rx='7' fill='%239DB04A' stroke-width='0'/><circle cx='12' cy='8.5' r='5'/><path d='M2 31c0-8.5 4.3-13.5 10-13.5s10 5 10 13.5z'/><path d='M18.5 20.5l7-7' stroke-width='3.2' stroke-linecap='round' fill='none'/><path d='M27 30V9M24.5 2.5v4.2a2.5 2.5 0 0 0 5 0V2.5M27 2.5v4' stroke-width='2' stroke-linecap='round' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --paper:#FBF8F4; --ink:#3A302A; --muted:#7D7168; --rule:#E3D8CC; --rule2:#CDBFB1; --soft:#F0E8DF; --bar:#FFFFFF; --water:#2E9CAB; --pro-bg:#E3EEF8; --pro:#2F5E86; --carb-bg:#F5ECDA; --carb:#86652A; --fat-bg:#FBE3DC; --fat:#A13F2A; --pro-bar:#5B95C9; --carb-bar:#CDAE6E; --fat-bar:#E5836B;
  --accent:#9DB04A; --accent-ink:#56631A; --accent-deep:#6E7F24; --black:#1F2410; --tomato:#C0392B; --field:#FFFFFF;
  --font:"Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#1E1A17; --ink:#EDE6DE; --muted:#A89C91; --rule:#3A322C; --rule2:#4D433B; --soft:#2A2420; --bar:#26211D; --water:#5CC3D0; --pro-bg:#1C2A38; --pro:#9CC4EA; --carb-bg:#3A3120; --carb:#E2C999; --fat-bg:#3A221D; --fat:#F2A694; --pro-bar:#6FA6D8; --carb-bar:#D8BD8A; --fat-bar:#E8927C; --accent:#A6BA52; --accent-ink:#C8D97F; --accent-deep:#B7CA66; --tomato:#FF7B6B; --field:#26211D; }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px}
.brand{background:var(--accent);color:var(--black);margin:0 0 6px;padding:12px max(18px, calc((100% - 560px)/2 + 18px));border-bottom:3px solid var(--accent-deep);font-weight:900;font-stretch:75%;font-size:1.6rem;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.brand .logo{flex:none}
.wrap{max-width:560px;margin:0 auto;padding:4px 18px 110px}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.datebar h1{margin:0;font-size:1.05rem;font-weight:700;font-stretch:90%}
.iconbtn{background:none;border:0;width:44px;height:44px;font-size:1.5rem;line-height:1;border-radius:50%}
.iconbtn:disabled{opacity:.25}

/* nutrition-label panel */
.label{border:1.5px solid var(--rule2);border-radius:10px;background:var(--bar);padding:12px 14px 14px}
.label .title{font-weight:900;font-stretch:70%;font-size:2.4rem;line-height:1;letter-spacing:-.01em;margin:0 0 4px}
.rule-thick{height:6px;background:var(--accent);border-radius:3px;margin:6px 0}
.rule-mid{height:3px;background:var(--rule2);margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);padding:4px 0}
.row:first-of-type{border-top:0}
.row b{font-weight:800}
.remain{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.remain .big{color:var(--accent-deep);font-weight:900;font-stretch:75%;font-size:3.6rem;line-height:.9;font-variant-numeric:tabular-nums}
.remain .big.over{color:var(--tomato)}
.remain .cap{font-weight:800;font-size:1.05rem}
.bar{height:8px;border-radius:4px;background:var(--soft);margin:10px 0 4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent-deep)}
.bar i.over{background:var(--tomato)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);margin-top:8px}
.macros div{padding:6px 0 0}
.macros div+div{border-left:1px solid var(--rule);padding-left:10px}
.macros.tint{border-top:0;gap:8px;margin-top:10px}
.macros.tint div{border:0;border-radius:8px;padding:8px 10px}
.macros.tint div+div{border-left:0;padding-left:10px}
.m-p{background:var(--pro-bg)} .m-p b,.macros.tint .m-p span{color:var(--pro)}
.m-c{background:var(--carb-bg)} .m-c b,.macros.tint .m-c span{color:var(--carb)}
.m-f{background:var(--fat-bg)} .m-f b,.macros.tint .m-f span{color:var(--fat)}
.mmac .chip{padding:2px 9px;border-radius:999px}
.mmac .chip.m-p{color:var(--pro)} .mmac .chip.m-c{color:var(--carb)} .mmac .chip.m-f{color:var(--fat)}
.macros.four{grid-template-columns:repeat(4,1fr)}
.macros.tint b small{font-size:.72rem;font-weight:700;opacity:.8}
.tlabel{display:flex!important;justify-content:space-between;align-items:baseline;gap:4px}
.tlabel em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.tlabel em.tover::after{content:" ▲";font-size:.65em}
.tbar{display:block;height:5px;border-radius:3px;background:rgba(127,127,127,.18);margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:3px}
.m-p .tbar i{background:var(--pro-bar)} .m-c .tbar i{background:var(--carb-bar)} .m-f .tbar i{background:var(--fat-bar)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.m-p-lbl{color:var(--pro)} .m-c-lbl{color:var(--carb)} .m-f-lbl{color:var(--fat)}
.m-p-lbl input,.m-c-lbl input,.m-f-lbl input{color:var(--ink)}
.macros.four b{font-size:1.05rem}
.macros b{display:block;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.macros span{font-size:.85rem;color:var(--muted)}

/* sections */
section.meal{margin-top:22px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--rule2);padding-bottom:3px}
button.mhead{width:100%;background:none;border-top:0;border-left:0;border-right:0;padding:0 0 3px;text-align:left;color:inherit;cursor:pointer}
.chev{font-style:normal;color:var(--accent-ink);font-weight:800;margin-left:2px}
.morelink{display:block;width:100%;margin-top:12px;padding:10px 0 0;border:0;border-top:1px solid var(--rule);background:none;text-align:left;font-weight:800;color:var(--accent-ink)}
.subhead{margin:10px 0 6px;font-weight:800}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin-top:6px}
.split.big{height:16px;border-radius:8px;margin:4px 0 10px}
.split i{display:block;height:100%}
.sp{background:var(--pro-bar)} .sc{background:var(--carb-bar)} .sf{background:var(--fat-bar)}
.brow{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:9px 12px;margin-top:6px}
.brow b{display:block;font-weight:800}
.brow span{font-size:.85rem}
.brow.m-p span,.brow.m-p b{color:var(--pro)} .brow.m-c span,.brow.m-c b{color:var(--carb)} .brow.m-f span,.brow.m-f b{color:var(--fat)}
.bnum{text-align:right;font-variant-numeric:tabular-nums}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.key:first-child{margin-left:0}
.mhead h2{margin:0;padding-left:10px;border-left:6px solid var(--accent);font-size:1.25rem;font-weight:800;font-stretch:85%}
.mhead span{font-weight:700;font-variant-numeric:tabular-nums}
.mmac{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--rule);font-size:.9rem;color:var(--muted)}
.mmac b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--soft);padding:8px 0}
.it-main{flex:1;min-width:0}
.it-main.tap{cursor:pointer}
.it-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-sub{font-size:.85rem;color:var(--muted)}
.it-kcal{font-weight:700;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--muted);width:36px;height:36px;font-size:1.2rem;border-radius:50%}
.addline{background:none;border:0;padding:10px 0;font-weight:800;color:var(--accent-ink)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:190px;background:none;border:0;padding:14px 0;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);box-shadow:inset 0 4px 0 var(--accent-deep)}

/* forms */
label.f{display:block;margin:12px 0 0;font-size:.9rem;font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;background:var(--field);border:1.5px solid var(--rule);border-radius:6px}
label.f input:focus,label.f select:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
.primary{display:block;width:100%;margin-top:18px;padding:14px;background:var(--accent);color:var(--black);border:0;border-radius:6px;font-weight:800;font-size:1.05rem}
.secondary{padding:10px 14px;background:none;border:1.5px solid var(--ink);border-radius:6px;font-weight:700}
.danger{color:var(--tomato);border-color:var(--tomato)}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.95rem}
.check input{width:20px;height:20px}

/* sheet */
dialog{border:0;padding:0;width:100%;max-width:560px;max-height:92vh;margin:auto auto 0;background:var(--paper);color:var(--ink);border-radius:16px 16px 0 0}
@media (min-width:600px){dialog{margin:auto;border-radius:14px}}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h3{margin:0;font-size:1.3rem;font-weight:800;font-stretch:85%}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin:12px 0 4px}
.seg button{flex:1;background:none;border:0;padding:10px 2px;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--black)}
#reader{width:100%;min-height:220px;background:#000;border-radius:8px;overflow:hidden;margin-top:12px}
#reader video{width:100%!important;display:block}
.status{margin-top:12px;font-weight:600}
.status.err{color:var(--tomato)}
.portion-name{font-size:1.2rem;font-weight:800;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:var(--soft);padding:4px 8px;border-radius:4px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.search{margin-top:12px}

/* history */
.hist li{cursor:pointer}
.hbar{height:6px;background:var(--soft);margin-top:5px;position:relative;overflow:hidden}
.hbar i{position:absolute;inset:0 auto 0 0;background:var(--accent-deep)}
.hbar i.over{background:var(--tomato)}
.empty{color:var(--muted);padding:12px 0}
h2.page{font-size:1.9rem;font-weight:900;font-stretch:72%;margin:8px 0 6px;border-bottom:6px solid var(--accent);padding-bottom:4px}
dialog.confirm{margin:auto;width:calc(100% - 48px);max-width:360px;border-radius:14px}
.cf{padding:20px 20px 16px}
.cf-title{margin:0;font-size:1.15rem;font-weight:800}
.cf-msg{margin:6px 0 0;color:var(--muted)}
.cf-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.cf-btns button{flex:1}
.danger-fill{background:var(--tomato);border-color:var(--tomato);color:#fff}
.addrow{display:flex;gap:6px 24px;flex-wrap:wrap;align-items:center;justify-content:center}
.addline.soft{color:var(--muted);font-weight:700}
.lhead{display:block!important;border-bottom:0!important;padding:14px 0 2px!important;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--accent-ink)}
.quick{margin-top:12px;padding:12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--bar)}
.water,.card{margin-top:18px;padding:12px 14px;border:1.5px solid var(--rule2);border-radius:10px;background:var(--bar)}
.whead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.whead h2{margin:0;font-size:1.15rem;font-weight:800;font-stretch:85%}
.whead span{font-size:.9rem;color:var(--muted)} .whead b{color:var(--ink)}
.glasses{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px}
.glass{width:32px;height:38px;border:0;background:none;padding:0;border-radius:8px;display:grid;place-items:center;color:var(--water)}
.glass .go{stroke:var(--water)} .glass .gw{fill:transparent} .glass.full .gw{fill:var(--water)}
.glass.plus{border:1.5px dashed var(--rule2);font-size:1.2rem;font-weight:700;color:var(--muted);width:32px;height:32px;margin:3px 0 0 4px}
.wchart{width:100%;height:auto;display:block;margin-top:8px}
.wbar{fill:var(--accent)} .wbar.over{fill:var(--tomato)}
.wgoal{stroke:var(--accent-deep);stroke-width:1.5;stroke-dasharray:4 4}
.wgrid{stroke:var(--rule);stroke-width:1}
.wlbl{font-size:11px;fill:var(--muted);font-family:var(--font)}
.wval{font-size:9.5px;fill:var(--muted);font-family:var(--font);font-weight:700}
.wline{fill:none;stroke:var(--accent-deep);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.wdot{fill:var(--bar);stroke:var(--accent-deep);stroke-width:2}
.avgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.avgs div{border-radius:8px;padding:6px 8px;background:var(--soft)}
.avgs b{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.avgs span{font-size:.78rem}
.avgs .m-p b,.avgs .m-p span{color:var(--pro)} .avgs .m-c b,.avgs .m-c span{color:var(--carb)} .avgs .m-f b,.avgs .m-f span{color:var(--fat)}
.datebtn{background:none;border:0;padding:8px 10px;border-radius:8px;font-size:1.05rem;font-weight:700;font-stretch:90%}
.datebtn span{color:var(--accent-ink);font-size:.8rem}
.calnav{display:flex;align-items:center;gap:6px;margin-top:10px}
.calnav select{flex:1;padding:9px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--field);font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}
.cdow{font-size:.78rem;font-weight:800;color:var(--muted);padding:4px 0}
.cday{position:relative;aspect-ratio:1;border:0;border-radius:50%;background:none;font-weight:600;font-variant-numeric:tabular-nums}
.cday:disabled{opacity:.3}
.cday.today{box-shadow:inset 0 0 0 1.5px var(--accent-deep)}
.cday.sel{background:var(--accent);color:var(--black);font-weight:800}
.cdot{position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent-deep)}
.cday.sel .cdot{background:var(--black)}
.cdot.inline{position:static;display:inline-block;margin:0 4px 1px 0;vertical-align:middle}
.ranges{display:flex;gap:3px;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.ranges button{flex:1 1 0;min-width:0;padding:5px 0}
.ranges button,.viewtog button{border:1.5px solid var(--rule);background:none;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--muted)}
.ranges button[aria-pressed="true"],.viewtog button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--black)}
.viewtog{display:flex;gap:4px}
.viewtog button{padding:4px 10px}
.wdot.over{stroke:var(--tomato)}
.unitrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.9rem;font-weight:600}
.muted{color:var(--muted);font-weight:500}
.macros.tint .tap,.macros.four .tap{cursor:pointer}
.macros.four span{white-space:nowrap}
.sn{background:var(--accent-deep)} .sover{background:var(--tomato)}
.overtxt{color:var(--tomato)}
.m-n-card .title{color:var(--ink)}
.brow.tap{cursor:pointer}
.tbar.big{height:10px;border-radius:5px;margin-top:10px}
.tbar.big i{border-radius:5px}
.m-p-card .title{color:var(--pro)} .m-c-card .title{color:var(--carb)} .m-f-card .title{color:var(--fat)}
.it-kcal small{font-weight:600;margin-left:2px}
h2.subpage{font-size:1.2rem;font-weight:800;margin:26px 0 0}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="brand"><svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="0"><circle cx="12" cy="8.5" r="5"/><path d="M2 31c0-8.5 4.3-13.5 10-13.5s10 5 10 13.5z"/><path d="M18.5 20.5l7-7" stroke-width="3.2" stroke-linecap="round" fill="none"/><path d="M27 30V9M24.5 2.5v4.2a2.5 2.5 0 0 0 5 0V2.5M27 2.5v4" stroke-width="2" stroke-linecap="round" fill="none"/></svg>BiteWise</header>
<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="Main">
  <button data-tab="today" aria-current="page">Today</button>
  <button data-tab="history">History</button>
  <button data-tab="settings">Settings</button>
</nav>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<dialog id="confirm" class="confirm" aria-labelledby="cfTitle">
  <div class="cf">
    <p class="cf-title" id="cfTitle"></p>
    <p class="cf-msg" id="cfMsg"></p>
    <div class="cf-btns">
      <button class="secondary" id="cfNo">Cancel</button>
      <button class="secondary danger-fill" id="cfYes">Remove</button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- confirm dialog ---------- */
function askConfirm(title, msg = "", yes = "Remove"){
  const dlg = document.getElementById("confirm");
  document.getElementById("cfTitle").textContent = title;
  document.getElementById("cfMsg").textContent = msg;
  document.getElementById("cfMsg").hidden = !msg;
  document.getElementById("cfYes").textContent = yes;
  return new Promise(resolve => {
    const done = v => { dlg.onclose = null; if (dlg.open) dlg.close(); resolve(v); };
    document.getElementById("cfYes").onclick = () => done(true);
    document.getElementById("cfNo").onclick = () => done(false);
    dlg.onclick = e => { if (e.target === dlg) done(false); };
    dlg.onclose = () => done(false);   // back button / Esc
    dlg.showModal();
    document.getElementById("cfNo").focus();
  });
}

/* ---------- storage ---------- */
const KEY = "bitewise.v1";
const OLD_KEY = "merafood.v1";   // saved under the app's old name; read it so existing logs carry over
const blank = () => ({ settings:{ weight:70, goal:2000 }, days:{}, foods:[], weights:[] });
let S;
try { S = JSON.parse(localStorage.getItem(KEY) ?? localStorage.getItem(OLD_KEY)) || blank(); } catch { S = blank(); }
S.settings ??= { weight:70, goal:2000 }; S.days ??= {}; S.foods ??= []; S.weights ??= [];
S.settings.waterGoal ??= 8;   // glasses of 250 ml
S.settings.wUnit ??= "kg";     // weight is always stored in kg; shown in kg or lb
const LB = 2.20462;
const wU = () => S.settings.wUnit === "lb" ? "lb" : "kg";
const toU = kg => wU() === "lb" ? kg * LB : kg;          // kg -> shown unit
const fromU = v => wU() === "lb" ? v / LB : v;           // shown unit -> kg
const fmtW = kg => `${r1(toU(kg))} ${wU()}`;
const COMMON_MACROS = { p:20, c:50, f:30 };   // % of daily calories, a common balanced split
// Use the common split unless you've chosen your own in Settings (replaces the old 40/40/20 default).
if (!S.settings.macrosSet) S.settings.macros = { ...COMMON_MACROS };
/* daily gram targets from the calorie goal and macro split */
S.settings.addExercise ??= true;   // add exercise calories to the day's budget and macro targets
/* the day's calorie budget: goal, plus exercise when that setting is on */
function budget(k){ return S.settings.goal + (S.settings.addExercise && k ? totals(k).burned : 0); }
/* daily gram targets from the day's calorie budget and macro split */
function targets(k){
  const g = budget(k), m = S.settings.macros;
  return { p: g*m.p/100/4, c: g*m.c/100/4, f: g*m.f/100/9 };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("Couldn't save. Storage may be full."); } }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const prevKey = k => { const x = fromKey(k); x.setDate(x.getDate() - 1); return keyOf(x); };
const day = k => (S.days[k] ??= { food:[], ex:[] });
const MEALS = ["Breakfast","Lunch","Dinner","Snacks"];
function guessMeal(){ const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 21 ? "Dinner" : "Snacks"; }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function totals(k){
  const d = S.days[k] || { food:[], ex:[] };
  const t = { kcal:0, p:0, c:0, f:0, fi:0, su:0, sf:0, na:0, burned:0 };
  d.food.forEach(e => { t.kcal += e.kcal; t.p += e.p; t.c += e.c; t.f += e.f; t.fi += e.fi||0; t.su += e.su||0; t.sf += e.sf||0; t.na += e.na||0; });
  d.ex.forEach(e => { t.burned += e.kcal; });
  return t;
}
function niceDate(k){
  const t = todayKey(), d = fromKey(k);
  const y = new Date(); y.setDate(y.getDate()-1);
  const label = d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
  if (k === t) return "Today, " + label;
  if (k === keyOf(y)) return "Yesterday, " + label;
  return label;
}

/* ---------- breakdown screen ---------- */
let detail = null;   // null, "day", a meal name, or "nut-<key>"
let backStack = [];  // screens to return to with ‹
function sumOf(items){
  const t = { kcal:0, p:0, c:0, f:0, fi:0, su:0, sf:0, na:0 };
  items.forEach(e => NUT.forEach(k => t[k] += +e[k] || 0));
  return t;
}
function split(t){
  const p = t.p*4, c = t.c*4, f = t.f*9, sum = p + c + f;
  const pct = x => sum ? x / sum * 100 : 0;
  return { p, c, f, sum, pp:pct(p), pc:pct(c), pf:pct(f) };
}
function splitBar(t, cls = ""){
  const s = split(t);
  if (!s.sum) return `<div class="split ${cls}"></div>`;
  return `<div class="split ${cls}" role="img" aria-label="Protein ${r0(s.pp)}%, carbs ${r0(s.pc)}%, fat ${r0(s.pf)}%">
    <i class="sp" style="width:${s.pp}%"></i><i class="sc" style="width:${s.pc}%"></i><i class="sf" style="width:${s.pf}%"></i></div>`;
}
function renderDetail(){

  const items = isDay ? d.food : d.food.filter(e => e.meal === detail);
  const t = sumOf(items), s = split(t);

      <div class="bnum"><b>${r0(kcal)} kcal</b><span>${r0(pct)}%${isDay ? ` · goal ${M[key[name]]}%` : ""}</span></div>

  let html = `
  <div class="datebar">
    <button class="iconbtn" id="dBack" aria-label="Back to today">‹</button>

    <span style="width:44px"></span>
  </div>
  <div class="label">
    <p class="title">${r0(t.kcal)} kcal</p>
    <p class="note" style="margin:0">${isDay ? (cur === todayKey() ? "Eaten today" : "Eaten this day") : "Eaten at " + esc(detail.toLowerCase())}</p>
    <div class="rule-thick"></div>
    <p class="subhead">Where the calories come from</p>
    ${splitBar(t, "big")}
    ${s.sum ? row("m-p","Protein",t.p,s.p,s.pp,4) + row("m-c","Carbs",t.c,s.c,s.pc,4) + row("m-f","Fat",t.f,s.f,s.pf,9)
            : `<p class="empty">Nothing logged ${isDay ? "for this day" : "for " + esc(detail.toLowerCase())} yet.</p>`}
    ${s.sum ? `<p class="note">Protein and carbs have 4 kcal per gram, fat has 9. Labels round their numbers and count fiber differently, so this adds up to ${r0(s.sum)} kcal, close to but not always exactly the total above.</p>` : ""}
    <div class="macros four" style="margin-top:12px">
      ${[["fi","Fiber","g"],["su","Sugar","g"],["sf","Sat fat","g"],["na","Sodium","mg"]].map(([k,n,u]) => isDay
        ? `<div class="tap" data-detail="nut-${k}" role="button" tabindex="0" aria-label="See where your ${n.toLowerCase()} came from"><b>${r0(t[k])} ${u}</b><span>${n} ›</span></div>`
        : `<div><b>${r0(t[k])} ${u}</b><span>${n}</span></div>`).join("")}
    </div>
  </div>`;
  if (isDay){
    html += `<section class="meal"><div class="mhead"><h2>By meal</h2></div><ul class="items">`;
    MEALS.forEach(m => {
      const mt = sumOf(d.food.filter(e => e.meal === m));
      const share = t.kcal ? mt.kcal / t.kcal * 100 : 0;
      html += `<li><div class="it-main tap" data-detail="${m}" role="button" tabindex="0">
        <div class="it-name">${m} <span class="it-sub">· ${r0(share)}% of the day</span></div>
        <div class="it-sub">P ${r0(mt.p)} g · C ${r0(mt.c)} g · F ${r0(mt.f)} g</div>${splitBar(mt)}</div>
        <span class="it-kcal">${r0(mt.kcal)}</span></li>`;
    });
    html += `</ul></section>`;
  } else {
    html += `<section class="meal"><div class="mhead"><h2>Foods</h2><span>${items.length}</span></div><ul class="items">`;
    items.forEach(e => {
      const share = t.kcal ? e.kcal / t.kcal * 100 : 0;
      html += `<li><div class="it-main tap" data-edit-food="${e.id}" role="button" tabindex="0">
        <div class="it-name">${esc(e.name)}</div>
        <div class="it-sub">${esc(e.amount)} · ${r0(share)}% of this meal · P ${r0(e.p)} · C ${r0(e.c)} · F ${r0(e.f)}</div>${splitBar(e)}</div>

  $("#app").innerHTML = html;

    el.onclick = open; el.onkeydown = ev => { if (ev.key === "Enter") open(); };
  });
}

/* ---------- water ---------- */
const GLASS = `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path class="gw" d="M6.2 9.5h11.6l-1.1 10.1a2 2 0 0 1-2 1.8H9.3a2 2 0 0 1-2-1.8z"/><path class="go" d="M5 3h14l-1.9 16.7a2 2 0 0 1-2 1.8H8.9a2 2 0 0 1-2-1.8z" fill="none" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
function waterCard(d){
  const n = d.water || 0, goal = S.settings.waterGoal || 8, shown = Math.max(goal, n);
  let glasses = "";
  for (let i = 0; i < shown; i++) glasses += `<button class="glass ${i < n ? "full" : ""}" data-glass="${i}" aria-label="${i+1} glass${i ? "es" : ""}">${GLASS}</button>`;
  return `<section class="water">

function wireWater(d){
  document.querySelectorAll("[data-glass]").forEach(b => b.onclick = () => {

    d.water = (n === i + 1) ? i : i + 1;   // tap the last full glass to empty it

/* ---------- calendar picker ---------- */
const hasFood = k => (S.days[k]?.food || []).length > 0;
function openCalendar(y, m){
  const first = new Date(y, m, 1), startDow = (first.getDay() + 6) % 7;   // Monday first
  const daysIn = new Date(y, m + 1, 0).getDate(), tk = todayKey();
  const loggedYears = Object.keys(S.days).filter(hasFood).map(k => +k.slice(0,4));
  const nowY = new Date().getFullYear(), minY = Math.min(nowY - 3, ...loggedYears);
  const monthNames = [...Array(12)].map((_, i) => new Date(2000, i, 1).toLocaleDateString(undefined, { month:"long" }));
  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<span></span>`;
  let count = 0;
  for (let d = 1; d <= daysIn; d++){
    const k = keyOf(new Date(y, m, d)), future = k > tk, dot = hasFood(k);
    if (dot) count++;
    cells += `<button class="cday ${k === cur ? "sel" : ""} ${k === tk ? "today" : ""}" data-cday="${k}" ${future ? "disabled" : ""}
      aria-label="${new Date(y,m,d).toLocaleDateString(undefined,{ day:"numeric", month:"long" })}${dot ? ", food logged" : ""}">${d}${dot ? `<i class="cdot"></i>` : ""}</button>`;
  }
  const atEnd = y > nowY || (y === nowY && m >= new Date().getMonth());
  openSheet(head("Pick a date") + `
    <div class="calnav">
      <button class="iconbtn" id="cPrev" aria-label="Previous month">‹</button>
      <select id="cMonth" aria-label="Month">${monthNames.map((n,i) => `<option value="${i}" ${i === m ? "selected" : ""}>${n}</option>`).join("")}</select>
      <select id="cYear" aria-label="Year">${[...Array(nowY - minY + 1)].map((_, i) => nowY - i).map(v => `<option ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select>
      <button class="iconbtn" id="cNext" aria-label="Next month" ${atEnd ? "disabled" : ""}>›</button>
    </div>
    <div class="cgrid">${["M","T","W","T","F","S","S"].map(d => `<span class="cdow">${d}</span>`).join("")}${cells}</div>
    <p class="note"><i class="cdot inline"></i> Food logged · ${count} day${count === 1 ? "" : "s"} this month</p>
    <button class="primary" id="cToday">Go to today</button>`);
  wireClose();
  const go = (yy, mm) => { const d = new Date(yy, mm, 1); openCalendar(d.getFullYear(), d.getMonth()); };
  $("#cPrev").onclick = () => go(y, m - 1);
  $("#cNext").onclick = () => go(y, m + 1);
  $("#cMonth").onchange = () => go(+$("#cYear").value, +$("#cMonth").value);
  $("#cYear").onchange = () => go(+$("#cYear").value, +$("#cMonth").value);
  document.querySelectorAll("[data-cday]").forEach(b => b.onclick = () => { cur = b.dataset.cday; detail = null; closeSheet(); render(); window.scrollTo(0,0); });
  $("#cToday").onclick = () => { cur = todayKey(); detail = null; closeSheet(); render(); window.scrollTo(0,0); };
}

/* ---------- where a nutrient came from ---------- */
/* reference amounts: your own targets for the big three, general guides for the rest */
function nutInfo(k){
  const B = budget(cur), T = targets(cur);
  return {
    p:  { name:"Protein", cls:"m-p", bar:"sp", unit:"g",  kind:"target", ref:T.p, per:4 },
    c:  { name:"Carbs",   cls:"m-c", bar:"sc", unit:"g",  kind:"target", ref:T.c, per:4 },
    f:  { name:"Fat",     cls:"m-f", bar:"sf", unit:"g",  kind:"target", ref:T.f, per:9 },
    fi: { name:"Fiber",   cls:"m-n", bar:"sn", unit:"g",  kind:"goal",  ref:B * 14 / 1000,
          note:"General guide: about 14 g of fiber for every 1,000 kcal you eat." },
    su: { name:"Sugar",   cls:"m-n", bar:"sn", unit:"g",  kind:"limit", ref:B * 0.10 / 4,
          note:"General guide: keep added sugar under 10% of calories. This total also counts natural sugar from fruit and milk, so going a little over isn't a concern if most of it comes from those." },
    sf: { name:"Sat fat", cls:"m-n", bar:"sn", unit:"g",  kind:"limit", ref:B * 0.10 / 9,
          note:"General guide: keep saturated fat under 10% of calories." },
    na: { name:"Sodium",  cls:"m-n", bar:"sn", unit:"mg", kind:"limit", ref:2000,
          note:"General guide: keep sodium under 2,000 mg a day (about 1 teaspoon of salt in total)." }
  }[k];
}
function renderNutrient(){
  const k = detail.slice(4), I = nutInfo(k);
  const fmt = v => I.unit === "mg" ? `${r0(v)} mg` : `${r1(v)} g`;
  const d = day(cur), t = sumOf(d.food), total = t[k], ref = I.ref;
  const real = ref ? total / ref * 100 : 0, over = I.kind === "limit" && real > 100;
  const items = d.food.filter(e => (e[k] || 0) > (I.unit === "mg" ? 0.5 : 0.05)).sort((a,b) => (b[k]||0) - (a[k]||0));
  const none = d.food.length - items.length, lower = I.name.toLowerCase();
  const share = g => total ? g / total * 100 : 0;
  const status = I.kind === "limit"
    ? (over ? `${fmt(total - ref)} over the guide` : `${fmt(ref - total)} left under the guide`)
    : (real < 100 ? `${fmt(ref - total)} to go` : real > 100 && I.kind === "target" ? `${fmt(total - ref)} over` : "goal reached");
  const refWord = I.kind === "target" ? "your target" : I.kind === "goal" ? "aim for at least" : "keep under";
  const chip = (x, label) => `<button data-detail="nut-${x}" aria-pressed="${x === k}">${label}</button>`;
  let html = `
  <div class="datebar">
    <button class="iconbtn" id="dBack" aria-label="Back to today">‹</button>
    <h1>${I.name}, ${esc(niceDate(cur).replace(/^(Today|Yesterday), /, ""))}</h1>
    <span style="width:44px"></span>
  </div>
  <div class="ranges" role="group" aria-label="Nutrient">${chip("p","Protein")}${chip("c","Carbs")}${chip("f","Fat")}</div>
  <div class="ranges" role="group" aria-label="More nutrients" style="margin-top:4px">${chip("fi","Fiber")}${chip("su","Sugar")}${chip("sf","Sat fat")}${chip("na","Sodium")}</div>
  <div class="label ${I.cls}-card" style="margin-top:12px">
    <p class="title">${fmt(total)}</p>
    <p class="note" style="margin:0">${refWord} ${fmt(ref)}${I.per ? ` · ${r0(total * I.per)} kcal from ${lower}` : ""}</p>
    <div class="tbar big"><i class="${over ? "sover" : I.bar}" style="width:${Math.min(100, real)}%"></i></div>
    <p class="note" style="margin:4px 0 0"><b class="${over ? "overtxt" : ""}">${r0(real)}%</b> of ${I.kind === "limit" ? "the limit" : I.kind === "goal" ? "the guide" : "target"} · ${status}</p>
    ${I.note ? `<p class="note">${I.note}</p>` : ""}
  </div>
  <section class="meal"><div class="mhead"><h2>By meal</h2></div><ul class="items">`;
  MEALS.forEach(m => {
    const g = d.food.filter(e => e.meal === m).reduce((a,e) => a + (e[k] || 0), 0);
    html += `<li><div class="it-main"><div class="it-name">${m}</div>
      <div class="split"><i class="${I.bar}" style="width:${share(g)}%"></i></div></div>
      <span class="it-kcal">${fmt(g)} <small class="muted">${r0(share(g))}%</small></span></li>`;
  });
  html += `</ul></section>
  <section class="meal"><div class="mhead"><h2>Foods</h2><span>${items.length}</span></div><ul class="items">`;
  if (!items.length) html += `<li class="empty">No ${lower} logged for this day yet.</li>`;
  items.forEach(e => {
    html += `<li><div class="it-main tap" data-edit-food="${e.id}" role="button" tabindex="0">
      <div class="it-name">${esc(e.name)}</div>
      <div class="it-sub">${esc(e.meal)} · ${esc(e.amount)} · ${r0(share(e[k]))}% of the day's ${lower}</div>
      <div class="split"><i class="${I.bar}" style="width:${share(e[k])}%"></i></div></div>
      <span class="it-kcal">${fmt(e[k])}</span></li>`;
  });
  html += `</ul>${none > 0 ? `<p class="note">${none} other food${none === 1 ? "" : "s"} had no ${lower}${k === "p" || k === "c" || k === "f" ? "" : " listed"}.</p>` : ""}
  ${!["p","c","f"].includes(k) ? `<p class="note">Home-cooked food only counts ${lower} from ingredients you've entered, like salt or ghee in a home recipe.</p>` : ""}</section>`;
  $("#app").innerHTML = html;
  $("#dBack").onclick = () => { detail = backStack.pop() || null; render(); window.scrollTo(0,0); };
  document.querySelectorAll("[data-detail]").forEach(b => b.onclick = () => { detail = b.dataset.detail; render(); });
  document.querySelectorAll("[data-edit-food]").forEach(el => {
    const open = () => { const e = d.food.find(x => x.id === el.dataset.editFood); if (e) { foodMeal = e.meal; showPortion(entryFood(e), e); } };
    el.onclick = open; el.onkeydown = ev => { if (ev.key === "Enter") open(); };
  });
}

/* ---------- today ---------- */

  const d = day(cur), t = totals(cur), goal = S.settings.goal;
  const addEx = S.settings.addExercise, B = budget(cur), tgt = targets(cur);
  const remaining = B - t.kcal;
  const pct = Math.min(100, B ? t.kcal / B * 100 : 0);
  const isToday = cur === todayKey();
  let html = `
  <div class="datebar">
    <button class="iconbtn" id="prev" aria-label="Previous day">‹</button>
    <button class="datebtn" id="pickDate" aria-label="Pick a date">${esc(niceDate(cur))} <span aria-hidden="true">▾</span></button>
    <button class="iconbtn" id="next" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button>
  </div>
  <div class="label">
    <p class="title">Calories</p>
    <div class="rule-thick"></div>
    <div class="row"><span>Daily goal</span><b>${r0(goal)}</b></div>
    <div class="row"><span>Food</span><b>− ${r0(t.kcal)}</b></div>
    <div class="row"><span>Exercise${addEx ? "" : ` <small class="muted">(not added)</small>`}</span><b>${addEx ? "+ " : ""}${r0(t.burned)}</b></div>
    <div class="rule-mid"></div>
    <div class="remain">
      <span class="cap">${remaining < 0 ? "Over by" : "Remaining"}</span>
      <span class="big ${remaining < 0 ? "over" : ""}">${r0(Math.abs(remaining))}</span>
    </div>
    <div class="bar" aria-hidden="true"><i class="${remaining < 0 ? "over" : ""}" style="width:${Math.max(0,pct)}%"></i></div>
    <div class="macros tint">
      ${[["m-p","Protein","p"],["m-c","Carbs","c"],["m-f","Fat","f"]].map(([cls,name,k]) => {
        const tg = tgt[k], real = tg ? t[k]/tg*100 : 0, pct = Math.min(100, real);
        return `<div class="${cls} tap" data-detail="nut-${k}" role="button" tabindex="0" aria-label="See where your ${name.toLowerCase()} came from"><b>${r0(t[k])}<small> / ${r0(tg)} g</small></b>
          <span class="tlabel"><span>${name}</span><em class="${real > 100 ? "tover" : ""}">${r0(real)}%</em></span>
          <i class="tbar" aria-label="${r0(t[k])} of ${r0(tg)} grams, ${r0(real)} percent"><i style="width:${pct}%"></i></i></div>`;
      }).join("")}
    </div>
    ${addEx && t.burned > 0 ? `<p class="note" style="margin:6px 0 0">Targets based on ${r0(B)} kcal: your ${r0(goal)} goal + ${r0(t.burned)} from exercise.</p>` : ""}
    <div class="macros four">
      ${[["fi","Fiber","g"],["su","Sugar","g"],["sf","Sat fat","g"],["na","Sodium","mg"]].map(([k,n,u]) =>
        `<div class="tap" data-detail="nut-${k}" role="button" tabindex="0" aria-label="See where your ${n.toLowerCase()} came from"><b>${r0(t[k])} ${u}</b><span>${n} ›</span></div>`).join("")}
    </div>
    <button class="morelink" data-detail="day">See where ${cur === todayKey() ? "today's" : "this day's"} calories come from ›</button>
  </div>`;
  MEALS.forEach(m => {
    const items = d.food.filter(e => e.meal === m);
    const sum = items.reduce((a,e) => ({ kcal:a.kcal+e.kcal, p:a.p+e.p, c:a.c+e.c, f:a.f+e.f, fi:a.fi+(e.fi||0), su:a.su+(e.su||0), sf:a.sf+(e.sf||0), na:a.na+(e.na||0) }), { kcal:0, p:0, c:0, f:0, fi:0, su:0, sf:0, na:0 });
    html += `<section class="meal"><button class="mhead tap" data-detail="${m}" aria-label="${m} details, ${r0(sum.kcal)} kcal"><h2>${m}</h2><span>${r0(sum.kcal)} kcal <i class="chev" aria-hidden="true">›</i></span></button>
      ${items.length ? `<div class="mmac"><span class="chip m-p">Protein <b>${r0(sum.p)} g</b></span><span class="chip m-c">Carbs <b>${r0(sum.c)} g</b></span><span class="chip m-f">Fat <b>${r0(sum.f)} g</b></span><span>Fiber <b>${r0(sum.fi)} g</b></span><span>Sugar <b>${r0(sum.su)} g</b></span><span>Sat fat <b>${r0(sum.sf)} g</b></span><span>Sodium <b>${r0(sum.na)} mg</b></span></div>` : ""}
      <ul class="items">`;
    items.forEach(e => {
      html += `<li><div class="it-main tap" data-edit-food="${e.id}" role="button" tabindex="0" aria-label="Edit ${esc(e.name)}"><div class="it-name">${esc(e.name)}</div><div class="it-sub">${esc(e.amount)} · P ${r0(e.p)} · C ${r0(e.c)} · F ${r0(e.f)}</div></div>
      <span class="it-kcal">${r0(e.kcal)}</span><button class="del" data-del-food="${e.id}" aria-label="Remove ${esc(e.name)}">✕</button></li>`;
    });
    const pk = prevKey(cur), prevItems = (S.days[pk]?.food || []).filter(e => e.meal === m);
    html += `</ul><div class="addrow"><button class="addline" data-add-meal="${m}">+ Add food</button>
      ${prevItems.length ? `<button class="addline soft" data-copy="${m}">↻ Copy ${cur === todayKey() ? "yesterday's" : "previous day's"} ${m.toLowerCase()}</button>` : ""}</div></section>`;
  });
  const exSum = d.ex.reduce((a,e) => a + e.kcal, 0);
  html += `<section class="meal"><div class="mhead"><h2>Exercise</h2><span>${r0(exSum)} kcal</span></div><ul class="items">`;
  d.ex.forEach(e => {
    html += `<li><div class="it-main"><div class="it-name">${esc(e.name)}</div><div class="it-sub">${e.min ? e.min + " min" : "Custom"}</div></div>
    <span class="it-kcal">${r0(e.kcal)}</span><button class="del" data-del-ex="${e.id}" aria-label="Remove ${esc(e.name)}">✕</button></li>`;
  });
  html += `</ul><div class="addrow"><button class="addline" id="addEx">+ Add exercise</button></div></section>`;
  html += waterCard(d);
  $("#app").innerHTML = html;

  $("#prev").onclick = () => { const x = fromKey(cur); x.setDate(x.getDate()-1); cur = keyOf(x); render(); };
  $("#pickDate").onclick = () => { const x = fromKey(cur); openCalendar(x.getFullYear(), x.getMonth()); };
  $("#next").onclick = () => { const x = fromKey(cur); x.setDate(x.getDate()+1); cur = keyOf(x); render(); };
  $("#addEx").onclick = openExercise;
  wireWater(d);
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const m = b.dataset.copy, items = (S.days[prevKey(cur)]?.food || []).filter(e => e.meal === m);
    const kcal = items.reduce((a,e) => a + e.kcal, 0);
    const names = items.slice(0, 3).map(e => e.name).join(", ") + (items.length > 3 ? ` and ${items.length - 3} more` : "");
    if (!await askConfirm(`Copy ${m.toLowerCase()}?`, `${items.length} item${items.length === 1 ? "" : "s"} · ${r0(kcal)} kcal: ${names}`, "Copy")) return;
    items.forEach(e => d.food.push({ ...JSON.parse(JSON.stringify(e)), id:uid() }));
    save(); render(); toast(`Copied to ${m.toLowerCase()}`);
  });
  document.querySelectorAll("[data-add-meal]").forEach(b => b.onclick = () => openFood(b.dataset.addMeal));
  document.querySelectorAll("[data-detail]").forEach(b => {
    const go = () => { backStack = []; detail = b.dataset.detail; render(); window.scrollTo(0,0); };
    b.onclick = go; b.onkeydown = ev => { if (ev.key === "Enter") go(); };
  });
  document.querySelectorAll("[data-edit-food]").forEach(el => {
    const open = () => { const e = d.food.find(x => x.id === el.dataset.editFood); if (e) { foodMeal = e.meal; showPortion(entryFood(e), e); } };
    el.onclick = open; el.onkeydown = ev => { if (ev.key === "Enter") open(); };
  });
  document.querySelectorAll("[data-del-food]").forEach(b => b.onclick = async () => {
    const e = d.food.find(x => x.id === b.dataset.delFood); if (!e) return;
    if (!await askConfirm(`Remove ${e.name}?`, `${e.amount} · ${r0(e.kcal)} kcal from ${e.meal.toLowerCase()}`)) return;
    d.food = d.food.filter(x => x.id !== e.id); save(); render(); toast("Removed");
  });
  document.querySelectorAll("[data-del-ex]").forEach(b => b.onclick = async () => {
    const e = d.ex.find(x => x.id === b.dataset.delEx); if (!e) return;
    if (!await askConfirm(`Remove ${e.name}?`, `${e.min ? e.min + " min · " : ""}${r0(e.kcal)} kcal burned`)) return;
    d.ex = d.ex.filter(x => x.id !== e.id); save(); render(); toast("Removed");
  });
}

/* ---------- sheet ---------- */
const sheet = $("#sheet");
function openSheet(html){ $("#sheetBody").innerHTML = html; if (!sheet.open) sheet.showModal(); }
function closeSheet(){ stopScan(); if (sheet.open) sheet.close(); }
sheet.addEventListener("close", () => { stopScan(); pick = null; });
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
const head = title => `<div class="shead"><h3>${title}</h3><button class="iconbtn" data-close aria-label="Close">✕</button></div>`;
function wireClose(){ document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => pick ? pick.cancel() : closeSheet()); }
const mealSelect = sel => `<label class="f">Meal<select id="meal">${MEALS.map(m => `<option ${m===sel?"selected":""}>${m}</option>`).join("")}</select></label>`;

/* ---------- add food ---------- */
let foodMeal = "Breakfast", foodMode = null;
let pick = null;   // when set, chosen foods go into a recipe instead of the log
function openFood(meal){ pick = null; foodMeal = meal || guessMeal(); showFoodTabs(foodMode || (S.foods.length ? "mine" : "scan")); }
const sheetTitle = () => pick ? "Add ingredient" : "Add to " + foodMeal;

function showFoodTabs(mode){
  foodMode = mode; stopScan();
  const seg = ["scan","search","manual","mine"].map(m => `<button data-mode="${m}" aria-pressed="${m===mode}">${{scan:"Scan",search:"Search",manual:"Enter",mine:"My foods"}[m]}</button>`).join("");
  let body = "";
  if (mode === "scan") body = `
    <div id="reader"></div>
    <p class="status" id="scanStatus">Point the camera at a barcode.</p>
    <label class="f">Or type the barcode<input id="codeIn" inputmode="numeric" placeholder="e.g. 3017620422003"></label>
    <button class="secondary" id="codeGo" style="margin-top:10px">Look up</button>`;
  else if (mode === "search") body = `
    <div style="display:flex;gap:8px;align-items:flex-end">
      <label class="f" style="flex:1">Search foods<input id="sq" type="search" enterkeyhint="search" placeholder="e.g. carrot raw, rice cooked"></label>
      <button class="secondary" id="sgo" style="height:46px">Search</button>
    </div>
    <p class="note">Plain foods from USDA FoodData Central. Add "raw" or "cooked" for better matches.</p>
    <p class="status" id="sStatus" hidden></p>
    <ul class="items" id="sList"></ul>`;
  else if (mode === "manual") body = (pick ? "" : `
    <div class="quick">
      <p class="subhead" style="margin:0">Quick add calories</p>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <label class="f" style="flex:1;margin-top:6px">Calories (kcal)<input id="qkKcal" type="number" inputmode="numeric" min="0" placeholder="e.g. 300"></label>
        <button class="secondary" id="qkAdd" style="height:46px">Add</button>
      </div>
      <p class="note">For when you don't know the details, like at a restaurant.</p>
    </div>
    <p class="subhead">Or enter a food with details</p>`) + manualForm({});
  else body = `
    ${pick ? "" : `<button class="secondary" id="newRecipe" style="width:100%;margin-top:12px">+ New home recipe</button>`}
    <label class="f search">Search<input id="q" placeholder="Name or brand"></label>
    <ul class="items" id="mineList"></ul>`;
  openSheet(head(sheetTitle()) + `<div class="seg">${seg}</div>` + body);
  wireClose();
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => showFoodTabs(b.dataset.mode));
  if (mode === "scan"){
    $("#codeGo").onclick = () => { const c = $("#codeIn").value.replace(/\D/g,""); if (c) handleCode(c); };
    startScan();
  } else if (mode === "search"){
    const go = () => usdaSearch($("#sq").value.trim());
    $("#sgo").onclick = go;
    $("#sq").onkeydown = e => { if (e.key === "Enter") go(); };
    if (lastSearch.q){ $("#sq").value = lastSearch.q; drawResults(lastSearch.results); }
    setTimeout(() => $("#sq")?.focus(), 50);
  } else if (mode === "manual"){
    wireManual({});
    if (!pick) $("#qkAdd").onclick = () => {
      const kcal = parseFloat($("#qkKcal").value);
      if (!(kcal > 0)){ toast("Enter calories"); return; }
      const food = { id:null, name:"Quick add", unit:"serving", base:1, ...perOf({ kcal }) };
      addEntry(food, 1, $("#meal").value);
    };
  } else {
    const draw = () => drawMine($("#q").value); $("#q").oninput = draw; draw();
    if (!pick) $("#newRecipe").onclick = () => showRecipe({ name:"", servings:1, items:[] });
  }
}

function manualForm(pre){
  return `
    <label class="f">Food name<input id="mName" value="${esc(pre.name||"")}" placeholder="e.g. Chicken rice bowl"></label>
    <label class="f">Calories (kcal)<input id="mKcal" type="number" inputmode="decimal" min="0" value="${pre.kcal ?? ""}"></label>
    <div class="grid2">
      <label class="f">Protein (g)<input id="mP" type="number" inputmode="decimal" min="0" value="${pre.p ?? ""}"></label>
      <label class="f">Carbs (g)<input id="mC" type="number" inputmode="decimal" min="0" value="${pre.c ?? ""}"></label>
      <label class="f">Fat (g)<input id="mF" type="number" inputmode="decimal" min="0" value="${pre.f ?? ""}"></label>
      <label class="f">Fiber (g)<input id="mFi" type="number" inputmode="decimal" min="0" value="${pre.fi ?? ""}"></label>
      <label class="f">Sugar (g)<input id="mSu" type="number" inputmode="decimal" min="0" value="${pre.su ?? ""}"></label>
      <label class="f">Sat fat (g)<input id="mSf" type="number" inputmode="decimal" min="0" value="${pre.sf ?? ""}"></label>
      <label class="f">Sodium (mg)<input id="mNa" type="number" inputmode="decimal" min="0" value="${pre.na ?? ""}"></label>
      <label class="f">Servings<input id="mQty" type="number" inputmode="decimal" min="0" step="0.25" value="1"></label>
    </div>
    <p class="note">Enter the values for one serving. Leave any you don't know blank.</p>
    ${pick ? "" : mealSelect(foodMeal)}
    <label class="check"><input type="checkbox" id="mSave" checked> Save to My foods</label>
    <button class="primary" id="mAdd">${pick ? "Add to recipe" : "Add food"}</button>`;
}
function wireManual(pre){
  $("#mAdd").onclick = () => {
    const name = $("#mName").value.trim(), kcal = parseFloat($("#mKcal").value);
    if (!name){ toast("Add a food name"); return; }
    if (!(kcal >= 0)){ toast("Add the calories"); return; }
    const food = { id:uid(), name, brand:"", barcode:pre.barcode||"", unit:"serving", base:1, defaultQty:1,
      kcal, p:parseFloat($("#mP").value)||0, c:parseFloat($("#mC").value)||0, f:parseFloat($("#mF").value)||0,
      fi:parseFloat($("#mFi").value)||0, su:parseFloat($("#mSu").value)||0, sf:parseFloat($("#mSf").value)||0, na:parseFloat($("#mNa").value)||0 };
    if ($("#mSave").checked) upsertFood(food);
    const q = parseFloat($("#mQty").value) || 1;
    if (pick) pick.done(food, q); else addEntry(food, q, $("#meal").value);
  };
}

function upsertFood(food){
  const i = S.foods.findIndex(x => x.id === food.id || (food.barcode && x.barcode === food.barcode) || (x.name.toLowerCase() === food.name.toLowerCase() && x.unit === food.unit && x.brand === food.brand));
  if (i >= 0) { food.id = S.foods[i].id; food.lastUsed ??= S.foods[i].lastUsed; if (!food.recipe && S.foods[i].recipe && S.foods[i].id === food.id) food.recipe = S.foods[i].recipe; S.foods[i] = food; } else S.foods.unshift(food);
  save();
}

function drawMine(q){
  q = (q||"").toLowerCase();
  const ul = $("#mineList");
  if (!S.foods.length){ ul.innerHTML = `<li class="empty">Foods you scan, search or enter are saved here for next time.</li>`; return; }
  const li = f => `<li>
    <div class="it-main tap" data-pick="${f.id}"><div class="it-name">${esc(f.name)}</div>
    <div class="it-sub">${f.recipe ? `<span class="tag">Recipe</span> ` : esc(f.brand ? f.brand + " · " : "")}${r0(f.kcal)} kcal per ${f.unit === "g" ? "100 g" : "serving"}</div></div>
    <button class="del" data-forget="${f.id}" aria-label="Remove ${esc(f.name)} from My foods">✕</button></li>`;
  let html = "";
  if (!q){
    const recent = S.foods.filter(f => f.lastUsed).sort((a,b) => b.lastUsed - a.lastUsed).slice(0, 12);
    if (recent.length) html += `<li class="lhead">Recent</li>` + recent.map(li).join("");
    const rest = S.foods.filter(f => !recent.includes(f)).sort((a,b) => a.name.localeCompare(b.name));
    if (rest.length) html += `<li class="lhead">${recent.length ? "All my foods" : "My foods"}</li>` + rest.map(li).join("");
  } else {
    const list = S.foods.filter(f => f.name.toLowerCase().includes(q) || (f.brand||"").toLowerCase().includes(q));
    html = list.length ? list.map(li).join("") : `<li class="empty">No match for "${esc(q)}".</li>`;
  }
  ul.innerHTML = html;
  ul.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => showPortion(S.foods.find(f => f.id === el.dataset.pick)));
  ul.querySelectorAll("[data-forget]").forEach(b => b.onclick = async () => {
    const f = S.foods.find(x => x.id === b.dataset.forget); if (!f) return;
    if (!await askConfirm(`Remove ${f.name} from My foods?`, "Food you've already logged stays in your log.")) return;
    S.foods = S.foods.filter(x => x.id !== f.id); save(); drawMine($("#q").value);
  });
}

const NUT = ["kcal","p","c","f","fi","su","sf","na"];
const perOf = food => Object.fromEntries(NUT.map(k => [k, +food[k] || 0]));
const fmtAmount = (unit, qty) => unit === "g" ? `${r0(qty)} g` : `${r1(qty)} serving${qty === 1 ? "" : "s"}`;

/* Rebuild a food object from a logged entry so it can be edited. */
function entryFood(e){
  const saved = S.foods.find(f => f.id === e.foodId);
  if (e.per) return { id:e.foodId || uid(), name:e.name, brand:saved?.brand || "", barcode:saved?.barcode || "",
    unit:e.unit, base:e.base, defaultQty:e.qty, ...e.per };
  // Entries logged before editing existed: treat the whole entry as 1 serving.
  return { id:uid(), name:e.name, brand:"", barcode:"", unit:"serving", base:1, defaultQty:1, ...perOf(e) };
}

/* entry = the logged item being edited, or null when adding new food */
function showPortion(food, entry = null){
  stopScan();
  const unitLabel = food.unit === "g" ? "Amount (g)" : "Servings";
  const qty0 = entry ? (entry.per ? entry.qty : 1) : food.defaultQty;
  const meal0 = entry ? (entry._draftMeal || entry.meal) : foodMeal;
  openSheet(head(entry ? "Edit food" : sheetTitle()) + `
    <p class="portion-name">${esc(food.name)}</p>
    ${food.brand ? `<p class="note" style="margin-top:2px">${esc(food.brand)}</p>` : ""}
    <p class="note">Per ${food.unit === "g" ? "100 g" : "serving"}: ${r0(food.kcal)} kcal · P ${r1(food.p)} · C ${r1(food.c)} · F ${r1(food.f)}<br>Fiber ${r1(food.fi||0)} g · Sugar ${r1(food.su||0)} g · Sat fat ${r1(food.sf||0)} g · Sodium ${r0(food.na||0)} mg</p>
    <label class="f">${unitLabel}<input id="qty" type="number" inputmode="decimal" min="0" step="${food.unit === "g" ? 1 : 0.25}" value="${qty0}"></label>
    <div class="chips" id="calc"></div>
    ${pick ? "" : mealSelect(meal0)}
    <button class="primary" id="pAdd">${entry ? "Save changes" : pick ? "Add to recipe" : "Add food"}</button>
    ${food.recipe && !entry && !pick
      ? `<button class="secondary" id="editRecipe" style="width:100%;margin-top:10px">Edit recipe</button>`
      : `<button class="secondary" id="fix" style="width:100%;margin-top:10px">Fix nutrition values</button>`}
    ${entry ? `<button class="secondary danger" id="pDel" style="width:100%;margin-top:10px">Remove from log</button>`
            : `<button class="addline" id="back">‹ Back</button>`}`);
  wireClose();
  const calc = () => {
    const q = parseFloat($("#qty").value) || 0, m = q / food.base;
    $("#calc").innerHTML = `<span>${r0(food.kcal*m)} kcal</span><span>Protein ${r1(food.p*m)} g</span><span>Carbs ${r1(food.c*m)} g</span><span>Fat ${r1(food.f*m)} g</span><span>Fiber ${r1((food.fi||0)*m)} g</span><span>Sugar ${r1((food.su||0)*m)} g</span><span>Sat fat ${r1((food.sf||0)*m)} g</span><span>Sodium ${r0((food.na||0)*m)} mg</span>`;
  };
  $("#qty").oninput = calc; calc();
  if ($("#editRecipe")) $("#editRecipe").onclick = () => showRecipe(recipeDraftOf(food));
  if ($("#fix")) $("#fix").onclick = () => {
    // keep the amount the person typed while they fix values
    const q = parseFloat($("#qty").value); if (q > 0) { if (entry) entry._draftQty = q; else food.defaultQty = q; }
    if (entry) entry._draftMeal = $("#meal").value; else if (!pick) foodMeal = $("#meal").value;
    showEditFood(food, entry);
  };
  if (entry){
    if (entry._draftQty) { $("#qty").value = entry._draftQty; calc(); }
    delete entry._draftQty; delete entry._draftMeal;
    $("#pDel").onclick = async () => {
      if (!await askConfirm(`Remove ${entry.name}?`, `${entry.amount} · ${r0(entry.kcal)} kcal from ${entry.meal.toLowerCase()}`)) return;
      const d = day(cur); d.food = d.food.filter(x => x.id !== entry.id);
      save(); closeSheet(); render(); toast("Removed");
    };
  } else {
    $("#back").onclick = () => showFoodTabs(foodMode || "mine");
  }
  $("#pAdd").onclick = () => {
    const q = parseFloat($("#qty").value);
    if (!(q > 0)){ toast("Enter an amount"); return; }
    if (entry){
      Object.assign(entry, buildEntry(food, q, $("#meal").value), { id:entry.id });
      save(); closeSheet(); render(); toast("Changes saved");
    } else {
      food.defaultQty = q; upsertFood(food);
      if (pick) pick.done(food, q); else addEntry(food, q, $("#meal").value);
    }
  };
}

function showEditFood(food, entry = null){
  const per = food.unit === "g" ? "100 g" : "1 serving";
  const fld = (id, label, v, dec) => `<label class="f">${label}<input id="${id}" type="number" inputmode="decimal" min="0" value="${v == null ? "" : (dec ? r1(v) : r0(v))}"></label>`;
  openSheet(head("Fix nutrition values") + `
    <label class="f">Food name<input id="eName" value="${esc(food.name)}"></label>
    <p class="note">Enter the values <b>per ${per}</b>. On the package, use the "per ${per}" column${food.unit === "g" ? ", not the per-serving column" : ""}.</p>
    ${fld("eKcal","Calories (kcal)",food.kcal)}
    <div class="grid2">
      ${fld("eP","Protein (g)",food.p,1)}${fld("eC","Carbs (g)",food.c,1)}
      ${fld("eF","Fat (g)",food.f,1)}${fld("eFi","Fiber (g)",food.fi,1)}
      ${fld("eSu","Sugar (g)",food.su,1)}${fld("eSf","Sat fat (g)",food.sf,1)}
      ${fld("eNa","Sodium (mg)",food.na)}
    </div>
    <button class="primary" id="eSave">Save values</button>
    <button class="addline" id="eBack">‹ Back</button>`);
  wireClose();
  $("#eBack").onclick = () => showPortion(food, entry);
  $("#eSave").onclick = () => {
    const v = id => parseFloat($(id).value);
    const name = $("#eName").value.trim(), kcal = v("#eKcal");
    if (!name){ toast("Add a food name"); return; }
    if (!(kcal >= 0)){ toast("Add the calories"); return; }
    Object.assign(food, { name, kcal, p:v("#eP")||0, c:v("#eC")||0, f:v("#eF")||0, fi:v("#eFi")||0, su:v("#eSu")||0, sf:v("#eSf")||0, na:v("#eNa")||0 });
    // When editing a logged item, only update My foods if that food is saved there.
    const inLibrary = S.foods.some(f => f.id === food.id || (food.barcode && f.barcode === food.barcode));
    if (!entry || inLibrary) upsertFood(food);
    toast("Values saved"); showPortion(food, entry);
  };
}

function buildEntry(food, qty, meal){
  const m = qty / food.base, per = perOf(food);
  const e = { meal, name:food.name, foodId:food.id, unit:food.unit, base:food.base, qty, per, amount:fmtAmount(food.unit, qty) };
  NUT.forEach(k => e[k] = per[k] * m);
  return e;
}

function addEntry(food, qty, meal){
  day(cur).food.push({ id:uid(), ...buildEntry(food, qty, meal) });
  const saved = S.foods.find(f => f.id === food.id); if (saved) saved.lastUsed = Date.now();
  save(); closeSheet(); render(); toast("Added to " + meal);
}

/* ---------- home recipes ---------- */
function recipeDraftOf(food){
  return { id:food.id, name:food.name, servings:food.recipe.servings, items:food.recipe.items.map(x => ({ ...x })) };
}
function recipeTotals(items){
  const t = Object.fromEntries(NUT.map(k => [k, 0]));
  items.forEach(it => NUT.forEach(k => t[k] += (it.per[k] || 0) * it.qty / it.base));
  return t;
}
function showRecipe(draft){

      <button class="del" data-rdel="${i}" aria-label="Remove ${esc(it.name)}">✕</button></li>`).join("")
      : `<li class="empty">No ingredients yet. Add everything that goes into the whole pot.</li>`}</ul>
    <button class="addline" id="rAdd">+ Add ingredient</button>
    ${draft.items.length ? `<div class="chips"><span>Whole recipe ${r0(t.kcal)} kcal</span><span>Per serving ${r0(t.kcal/n)} kcal</span>
      <span>P ${r1(t.p/n)} g</span><span>C ${r1(t.c/n)} g</span><span>F ${r1(t.f/n)} g</span></div>` : ""}
    <button class="primary" id="rSave">Save recipe</button>`);
  wireClose();
  const keep = () => { draft.name = $("#rName").value; draft.servings = parseFloat($("#rServ").value) || 1; };

  document.querySelectorAll("[data-rdel]").forEach(b => b.onclick = async () => {
    keep(); const it = draft.items[+b.dataset.rdel];

  $("#rAdd").onclick = () => {

        showRecipe(draft); toast("Ingredient added");
      },
      cancel: () => showRecipe(draft)
    };
    showFoodTabs(S.foods.length ? "mine" : "search");
  };
  $("#rSave").onclick = () => {
    keep();
    const name = draft.name.trim();
    if (!name){ toast("Give the recipe a name"); return; }
    if (!draft.items.length){ toast("Add at least one ingredient"); return; }
    const n = Math.max(0.25, draft.servings), tt = recipeTotals(draft.items);
    const food = { id:draft.id || uid(), name, brand:"", barcode:"", unit:"serving", base:1, defaultQty:1,
      ...Object.fromEntries(NUT.map(k => [k, tt[k] / n])), recipe:{ servings:n, items:draft.items } };
    const old = S.foods.find(f => f.id === food.id); if (old) food.lastUsed = old.lastUsed;
    upsertFood(food); toast("Recipe saved");
    showPortion(food);   // ready to log
  };
}

/* ---------- food search (USDA FoodData Central) ---------- */
let lastSearch = { q:"", results:[] };
const USDA_IDS = {           // nutrient ids, with fallbacks
  kcal:[1008, 2047, 2048], p:[1003], f:[1004], c:[1005, 1050],
  fi:[1079], su:[2000, 1063], na:[1093], sf:[1258]
};
function usdaFood(item){
  const byId = {};
  (item.foodNutrients || []).forEach(n => { if (n.value != null) byId[n.nutrientId] = n; });
  const pick = ids => { for (const id of ids) if (byId[id]) return +byId[id].value; return null; };
  let kcal = pick(USDA_IDS.kcal);
  if (kcal == null && byId[1062]) kcal = byId[1062].value / 4.184;   // kJ to kcal
  if (kcal == null) return null;
  const name = item.description.charAt(0) + item.description.slice(1).toLowerCase();
  return { id:"usda-" + item.fdcId, name, brand:"USDA", barcode:"", unit:"g", base:100, defaultQty:100,
    kcal, p:pick(USDA_IDS.p)||0, c:pick(USDA_IDS.c)||0, f:pick(USDA_IDS.f)||0,
    fi:pick(USDA_IDS.fi)||0, su:pick(USDA_IDS.su)||0, na:pick(USDA_IDS.na)||0, sf:pick(USDA_IDS.sf)||0 };
}
async function usdaSearch(q){
  const st = $("#sStatus"), list = $("#sList");
  if (!q){ toast("Type a food to search"); return; }
  st.hidden = false; st.className = "status"; st.textContent = "Searching…"; list.innerHTML = "";
  const key = (S.settings.usdaKey || "").trim() || "DEMO_KEY";
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(q)}&dataType=${encodeURIComponent("Foundation,SR Legacy")}&pageSize=30`;
  try {
    const res = await fetch(url);
    if (res.status === 429){ throw { msg: key === "DEMO_KEY" ? "Search limit reached for now. Add your own free key in Settings to search more." : "Search limit reached. Try again in a while." }; }
    if (res.status === 403 || res.status === 401){ throw { msg:"The search key wasn't accepted. Check the key in Settings." }; }
    if (!res.ok) throw { msg:"Search didn't work right now. Try again in a moment." };
    const j = await res.json();
    const results = (j.foods || []).map(usdaFood).filter(Boolean);
    lastSearch = { q, results };
    if (!$("#sList")) return;
    if (!results.length){ st.textContent = `No results for "${q}". Try a simpler word, like "zucchini".`; return; }
    st.hidden = true; drawResults(results);
  } catch (e){
    if (!$("#sStatus")) return;
    st.className = "status err";
    st.textContent = e && e.msg ? e.msg : "Couldn't reach the food database. Check your connection.";
  }
}
function drawResults(results){
  const list = $("#sList");
  list.innerHTML = results.map((f,i) => `<li><div class="it-main tap" data-res="${i}" role="button" tabindex="0">
    <div class="it-name" style="white-space:normal">${esc(f.name)}</div>
    <div class="it-sub">${r0(f.kcal)} kcal per 100 g · P ${r1(f.p)} · C ${r1(f.c)} · F ${r1(f.f)}</div></div></li>`).join("");
  list.querySelectorAll("[data-res]").forEach(el => {
    const open = () => {
      const f = results[+el.dataset.res];
      const saved = S.foods.find(x => x.id === f.id);   // reuse your fixes and last amount
      showPortion(saved ? saved : { ...f });
    };
    el.onclick = open; el.onkeydown = ev => { if (ev.key === "Enter") open(); };
  });
}

/* ---------- barcode scanning ---------- */
let scanner = null, scanBusy = false;
async function startScan(){
  const status = $("#scanStatus");
  if (!window.Html5Qrcode){ status.textContent = "Scanner couldn't load. Check your connection, or type the barcode."; status.className = "status err"; return; }
  if (!window.isSecureContext){ status.textContent = "Camera needs an https:// address. Type the barcode instead."; status.className = "status err"; return; }
  try {
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode("reader", { formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E], experimentalFeatures:{ useBarCodeDetectorIfSupported:true }, verbose:false });
    scanBusy = false;
    await scanner.start({ facingMode:"environment" }, { fps:10, qrbox:(w,h) => ({ width:Math.min(280, w*0.85), height:Math.min(150, h*0.6) }) },
      code => { if (scanBusy) return; scanBusy = true; if (navigator.vibrate) navigator.vibrate(60); stopScan(); handleCode(code); }, () => {});
  } catch (e){
    status.textContent = "Camera not available. Allow camera access, or type the barcode.";
    status.className = "status err";
  }
}
function stopScan(){
  if (!scanner) return;
  const s = scanner; scanner = null;
  try { if (s.isScanning) s.stop().then(() => s.clear()).catch(() => {}); else s.clear(); } catch {}
}

async function handleCode(code){
  const known = S.foods.find(f => f.barcode === code);
  if (known){ showPortion(known); return; }
  openSheet(head(sheetTitle()) + `<p class="status">Looking up ${esc(code)}…</p>`);
  wireClose();
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`);
    const j = await res.json();
    const p = j && j.status === 1 ? j.product : null;
    const n = (p && p.nutriments) || {};
    let kcal = n["energy-kcal_100g"];
    if (kcal == null && n["energy_100g"] != null) kcal = n["energy_100g"] / 4.184;
    if (!p || kcal == null){
      showMissing(code, p && p.product_name, "This product isn't in the food database yet, or has no calorie info. Enter it once and it'll be saved for next time.");
      return;
    }
    const serving = parseFloat(p.serving_quantity);
    showPortion({ id:uid(), barcode:code, name:p.product_name || "Unnamed product", brand:(p.brands||"").split(",")[0].trim(),
      unit:"g", base:100, defaultQty: serving > 0 ? r0(serving) : 100,
      kcal:+kcal, p:+(n.proteins_100g||0), c:+(n.carbohydrates_100g||0), f:+(n.fat_100g||0),
      fi:+(n.fiber_100g||0), su:+(n.sugars_100g||0), sf:+(n["saturated-fat_100g"]||0),
      na: n.sodium_100g != null ? n.sodium_100g*1000 : (n.salt_100g != null ? n.salt_100g/2.5*1000 : 0) });
  } catch {
    showMissing(code, "", "Couldn't reach the food database. Check your connection, or enter the food yourself.");
  }
}
function showMissing(code, name, msg){
  openSheet(head(sheetTitle()) + `<p class="status err">${esc(msg)}</p>` + manualForm({ name:name||"", barcode:code }));
  wireClose(); wireManual({ barcode:code });
}
